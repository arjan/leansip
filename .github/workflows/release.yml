# Builds, tests and packages leansip for Linux when a v* tag is pushed, and publishes a GitHub
# release with the .deb, the .tar.gz, the static .tar.gz (from build.yml), SHA256SUMS and build
# provenance attestations.
# The tag must match project(... VERSION) in CMakeLists.txt.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  linux:
    # Ubuntu 26.04 is the oldest we support: leansip needs baresip 1.1.0 or newer (1.0.0 has no
    # call ids), and its Qt and glibc set what the packages require.
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    permissions:
      contents: read
    steps:
      - name: Install build and test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake ninja-build dpkg-dev file \
            qt6-base-dev libtomlplusplus-dev baresip-core jq python3

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check that the tag matches the project version
        run: |
          version=$(sed -n 's/^project(leansip VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match project version $version" >&2
            exit 1
          fi
          if ! grep -q "tag: \"$GITHUB_REF_NAME\"" Formula/leansip.rb; then
            echo "Formula/leansip.rb does not install $GITHUB_REF_NAME; bump its tag" >&2
            exit 1
          fi

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      # Includes the loopback call test against a real baresip, with a fake speech service.
      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: cd build && cpack

      - name: Install the .deb and run it
        run: |
          apt-get install -y ./build/leansip_*.deb
          leansipctl --version
          leansipd --version
          QT_QPA_PLATFORM=offscreen leansip --version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages
          path: |
            build/leansip_*.deb
            build/leansip-*.tar.gz
          if-no-files-found: error

  # The static tarball, and the macOS build from the Homebrew formula (not attached: Homebrew
  # users install from the tap).
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    needs: [linux, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestations
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: dist

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-static
          path: dist

      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS

      # Attestations need a public repository (or GitHub Enterprise Cloud).
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event.repository.visibility == 'public'
        with:
          subject-path: |
            dist/*.deb
            dist/*.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "leansip $GITHUB_REF_NAME" \
            --generate-notes --verify-tag
